<header><small id="title"></small><h1 id="headline"></h1><div id="badges"></div><p class="muted" style="color:#b9c9df">含未脱敏原始日志，外发前请自查。</p></header>
<nav aria-label="报告视图" role="tablist"></nav><main></main><footer>机械校验只证明引用和结构一致，不证明语义因果。事件的时间先后不代表因果。本地报告未签名，不防本机写入者同时改动数据和校验记录。</footer>
<dialog aria-label="日志证据"><button class="close" autofocus>关闭 · Esc</button><div id="drawer"></div></dialog>
<script>
'use strict';const R=/*__REPORT__*/;
const $=s=>document.querySelector(s), E=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const names={fact:'事实',inference:'推断',gap:'缺口',caution:'注意',confirmed:'已确认',likely:'很可能',possible:'可能相关',undetermined:'未定',not_applicable:'不适用',supported:'通过',weakened:'部分失效',unsupported:'未通过',open:'待验证',refuted:'已排除',pending:'待清理',cleaned:'临时文件已清理',kept:'保留工作区',failed:'清理未完成',pass:'通过',pass_with_demotions:'通过 · 有降级',fail:'未通过'};
const evs=new Map(R.events.map(x=>[x.id,x])),eds=new Map(R.evidence.map(x=>[x.id,x]));
const anomalies=(R.diagnosis.unlinkedAnomalies||[]).filter(x=>x.status==='supported'),visibleAnomalies=[...anomalies.filter(x=>x.category==='candidate'),...anomalies.filter(x=>x.category==='unknown').sort((a,b)=>b.priority-a.priority).slice(0,5)],analysisQueries=R.queries.filter(q=>q.purpose!=='replay'),replayQueries=R.queries.filter(q=>q.purpose==='replay');
const lossSummary=R.coverage.lossSummary||{markers:0,reportedDroppedLines:0};
const good=R.findings.filter(x=>x.status==='supported');$('#title').textContent=R.title||'日志分析';document.title=R.title||'日志分析报告';
$('#headline').textContent=R.conclusion?.text||good.find(x=>x.type==='fact')?.text||'尚无通过校验的事实结论';
function badge(target,text,cls=''){target.append(E('span','badge '+cls,text))}
const assessment=R.diagnosis.causeAssessment||{ai:R.diagnosis.causeStatus,checked:R.diagnosis.causeStatus};
badge($('#badges'),names[R.conclusion?.type]||'摘要');badge($('#badges'),'原因 '+(names[assessment.ai]||assessment.ai)+' → '+(names[assessment.checked]||assessment.checked));badge($('#badges'),'校验 '+names[R.validation.status]);badge($('#badges'),`${R.coverage.files} 文件 · ${R.coverage.lines.toLocaleString()} 行 · ${lossSummary.markers} 处丢失`);badge($('#badges'),names[R.cleanup?.status]||'');
const tabs=[['overview','概览'],['chain','主链'],['timeline','时间线'],['hypotheses','假设与排除'],['evidence','证据'],['process','处理过程与范围']];
function activate(id){for(const [key] of tabs){$('#'+key).classList.toggle('active',key===id);$(`[data-tab="${key}"]`).setAttribute('aria-selected',String(key===id))}}
for(const [id,label]of tabs){const b=E('button','',label);b.dataset.tab=id;b.setAttribute('role','tab');b.setAttribute('aria-controls',id);b.addEventListener('click',()=>activate(id));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=tabs.findIndex(t=>t[0]===id),n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length][0];activate(n);$(`[data-tab="${n}"]`).focus()}});$('nav').append(b);const p=E('section','panel');p.id=id;p.setAttribute('role','tabpanel');$('main').append(p)}
function card(parent,title){const c=E('section','card');if(title)c.append(E('h2','',title));parent.append(c);return c}
function detail(parent,title,data){const d=E('details');d.append(E('summary','',title),E('pre','',typeof data==='string'?data:JSON.stringify(data,null,2)));parent.append(d)}
function refs(parent,ids=[]){const box=E('div','refs');for(const id of ids){const ev=eds.get(id);if(!ev)continue;const b=E('button','ref',ev.ref);b.addEventListener('click',()=>openEvidence(id));box.append(b)}parent.append(box)}
function openEvidence(id){const ev=eds.get(id);if(!ev)return;const d=$('#drawer');d.replaceChildren();if(ev.status!=='supported'){d.append(E('h2','',ev.ref),E('p','warning','此引用未通过校验，不展示其原文或来源。'));detail(d,'未通过原因',R.validation.demoted.filter(x=>x.id===id));if(!$('dialog').open)$('dialog').showModal();return;}d.append(E('h2','',ev.ref));badge(d,names[ev.status]);const f=R.input.files.find(x=>x.id===ev.fileId);const source=R.input.sources.find(x=>x.id===f?.provenance.sourceId);d.append(E('p','muted break',[source?.path,f?.provenance.member].filter(Boolean).join(' › ')),E('p','quote',ev.quote));detail(d,'原文与上下文',(ev.context||[]).map(x=>`${x.line}  ${x.text}`).join('\n'));d.lastChild.open=true;detail(d,'原始字段与规范化字段',ev.fields||[]);detail(d,'来源与 hash',{source,file:f,lineHash:ev.lineHash});const used=R.events.filter(x=>x.evidence?.includes(id));d.append(E('h3','','引用此证据的事件'));for(const x of used)d.append(E('p','',x.title));if(!$('dialog').open)$('dialog').showModal();history.replaceState(null,'','#'+encodeURIComponent(id))}
$('.close').onclick=()=>$('dialog').close();document.addEventListener('keydown',e=>{if(e.key==='/'&&!$('dialog').open&&e.target.tagName!=='INPUT'){e.preventDefault();activate('evidence');$('#filter').focus()}});
const ov=$('#overview');const conclusions=card(ov,'结论与问题');conclusions.id='summary';conclusions.append(E('p','',R.question?.raw||'未指定问题，按分诊整理'),E('p','muted','类型：'+(R.question?.type||'triage')));if(R.question?.restatement)conclusions.append(E('p','muted',R.question.restatement));
conclusions.append(E('p','',`AI 判断：${names[assessment.ai]||assessment.ai} → 工具核对后：${names[assessment.checked]||assessment.checked}`));for(const reason of assessment.reasons||[])conclusions.append(E('p','warning',reason));
for(const f of good){const box=E('article','finding');badge(box,names[f.type],f.type);box.append(E('p','',f.text));if(f.qualification)box.append(E('p','warning',f.qualification));if(f.lossSummary?.markers)box.append(E('p','warning',`检索范围有 ${f.lossSummary.markers} 处丢失标记，报告丢失 ${f.lossSummary.reportedDroppedLines} 条。`));refs(box,f.supports?.evidence);if(f.supports?.queries?.length)detail(box,'检索依据',R.queries.filter(q=>f.supports.queries.includes(q.id)));for(const warning of R.validation.warnings.filter(w=>w.id===f.id))box.append(E('p','muted',warning.hint));conclusions.append(box)}
const endpoint=card(ov,'最后可见点之后');endpoint.id='endpoint';const anchor=eds.get(R.diagnosis.anchor?.evidence);if(R.diagnosis.anchor&&anchor?.status==='supported'){endpoint.append(E('h3','',evs.get(R.diagnosis.lastVisible)?.title||'最后可见点'),E('p','muted',anchor.ref),E('pre','quote',(anchor.context||[]).find(x=>x.line===anchor.lines?.[0])?.text||anchor.quote));refs(endpoint,[anchor.id])}else endpoint.append(E('p','muted','本次未声明最后可见点。'));
for(const row of R.diagnosis.followups||[]){endpoint.append(E('p',row.count||row.unorderedCount?'warning break':'muted break',`${row.key}=${row.value} · 全集 ${row.occurrences} 次 · 锚行之后 ${row.count} 条 · 顺序未知 ${row.unorderedCount} 条`));for(const line of row.rows)endpoint.append(E('p','muted',line.ref),E('pre','',line.text));}
for(const event of R.diagnosis.afterEvents||[])endpoint.append(E('p','warning',`锚行之后的事件：${event.title} · ${event.role} · ${event.positions.map(p=>p.fileId+':L'+p.line).join('、')}`));
for(const id of R.diagnosis.cause?.evidence||[]){const e=eds.get(id);if(e?.status==='supported'){endpoint.append(E('p','muted','AI 所指原因行 · '+e.ref),E('pre','',e.quote));refs(endpoint,[id])}}
const neighborhood=R.diagnosis.neighborhood;if(neighborhood){const section=E('div');section.id='neighborhood';endpoint.append(section);section.append(E('h3','','邻域异常'),E('p','muted',`${neighborhood.matches} 条、${neighborhood.anomalyTemplates.length} 类；按首次出现、抬升倍数与优先级排序。排序不证明因果。`));const add=(p,t)=>{const row=E('div','finding');row.append(E('p','',t.template),E('p','muted',`${t.count} 次 · ${t.firstInNeighborhood?'全集首次出现于邻域':'此前已有'} · ${t.rate?.ratio!=null?'速率 '+t.rate.ratio.toFixed(2)+' 倍':t.rate?.newInWindow?'对照范围未出现':'范围不足以比较'} · ${t.discussed?'已讨论':'待查看'}`),E('p','muted break',t.refs.join('，')));p.append(row)};neighborhood.anomalyTemplates.slice(0,5).forEach(t=>add(section,t));if(neighborhood.anomalyTemplates.length>5){const d=E('details');d.append(E('summary','',`其余 ${neighborhood.anomalyTemplates.length-5} 类`));neighborhood.anomalyTemplates.slice(5).forEach(t=>add(d,t));section.append(d)}}
const limits=card(ov,'缺失、不足与建议');limits.id='limitations';const missing=R.diagnosis.firstMissing;if(missing){limits.append(E('p','',`未观测到的预期事件：${missing.expected}`));if(missing.qualification)limits.append(E('p','warning',missing.qualification));detail(limits,'检索范围与写法',{scope:missing.scope,patterns:missing.patterns,loss:missing.lossSummary})}for(const x of R.diagnosis.insufficiency||[])limits.append(E('p','',x.detail));for(const x of R.diagnosis.suggestions||[])limits.append(E('p','',`${x.what} · ${x.where} · ${x.why}`));if(!missing&&!R.diagnosis.insufficiency?.length&&!R.diagnosis.suggestions?.length)limits.append(E('p','muted','本次未补充说明。'));if(R.diagnosis.causeStatus==='undetermined')limits.append(E('p','warning','现有日志无法确定原因。'));
const scope=card(ov,'范围');scope.id='scope';scope.append(E('p','',`${R.coverage.files} 文件 · ${R.coverage.lines.toLocaleString()} 行 · ${lossSummary.markers} 处丢失标记，报告丢失 ${lossSummary.reportedDroppedLines} 条`),E('p','muted','时钟域相同不证明设备已校时；跨域不做时间比较。'));if(R.coverage.time.yearAssumed)scope.append(E('p','muted','无年份日志以 2000 年排序占位，不代表采集年份。'));for(const f of R.input.files){scope.append(E('p','muted',`${f.id} · ${f.format} · ${(f.parseRate*100).toFixed(1)}% 时间解析率 · ${f.encoding}`));if(f.invalidBytes||f.replacements)scope.append(E('p','warning',`${f.id} 编码告警：损坏字节 ${f.invalidBytes||0}，替换字符 ${f.replacements||0}`))}for(const x of neighborhood?.uncoveredFiles||[])scope.append(E('p','warning',`${x.fileId} 未覆盖：${x.reason}`));if(R.build?.identityStatus==='unverified')scope.append(E('p','warning','身份未核验：'+(R.build.identityDifferences||[]).join('、')));

function date(x){if(!x)return null;const v=Date.parse(x);return Number.isFinite(v)?v:null}
const allTimes=R.input.files.flatMap(f=>f.timeRange||[]).map(date).filter(x=>x!==null),lo=Math.min(...allTimes),hi=Math.max(...allTimes),span=Math.max(1,hi-lo);const pos=t=>Math.max(0,Math.min(100,(date(t)-lo)/span*100));

for(const f of R.input.files.filter(f=>f.stable===false))scope.append(E('p','warning',`${f.id}：采集重试后源文件仍在变化，报告基于实际捕获快照，未承诺覆盖全部新增日志。`));
detail(scope,'编码与输入一致性',R.input.files.map(f=>({file:f.id,encoding:f.encoding,confidence:f.encodingConfidence||f.confidence,invalidBytes:f.invalidBytes||0,changedBeforeScan:f.changedBeforeScan,stable:f.stable})));
for(const f of R.input.files.filter(x=>x.invalidBytes||x.replacements||x.changedBeforeScan))scope.append(E('p','warning',`${f.id}：损坏字节 ${f.invalidBytes||0}，替换字符 ${f.replacements||0}${f.changedBeforeScan?'；盘点后输入有变化':''}`));
if(R.coverage.templates!==undefined)scope.append(E('p','muted',`${R.coverage.templates} 种日志模板，占行数 ${(R.coverage.templateRatio*100).toFixed(2)}%`));


function lossOverlay(track,fileId){for(const x of R.coverage.lossWindows||[]){if(fileId&&x.fileId!==fileId||!x.start||!x.end)continue;const b=E('div','loss');b.style.left=pos(x.start)+'%';b.style.width=Math.max(.4,pos(x.end)-pos(x.start))+'%';b.title=`已知日志丢失 ${x.count} 条：${(x.rawRange||[x.start,x.end]).join(' → ')}`;track.append(b)}}
const map=E('div'),mapinner=E('div','map');scope.append(map);map.append(mapinner);for(const f of R.input.files){const row=E('div','maprow');row.append(E('span','',f.id));const track=E('div','track');if(f.timeRange?.[0]){const bar=E('div','bar');bar.style.left=pos(f.timeRange[0])+'%';bar.style.width=Math.max(1,pos(f.timeRange[1])-pos(f.timeRange[0]))+'%';track.append(bar)}row.append(track);mapinner.append(row)}
const chain=card($('#chain'),R.relations.some(x=>x.status==='supported')?'交互主链':'关键事件（未建立关联）');chain.append(E('p','muted','实线：同一 ID 已核对　·　点线：仅时间先后　·　上下顺序不代表因果'));
const events=R.events.filter(x=>x.status==='supported'),unsupported=R.events.filter(x=>x.status!=='supported');const mainNumbers=new Map(events.filter(x=>!x.role||x.role==='main').map((x,i)=>[x.id,String(i+1)]));let prev=null;events.filter(x=>!x.role||x.role==='main').forEach((ev,i)=>{if(prev){const r=R.relations.find(r=>r.from===prev.id&&r.to===ev.id&&r.status==='supported');chain.append(E('div',r?'connector '+(r.basis!=='same_id'?'time':''):'unlinked',r?(r.basis==='same_id'?'同一 ID：'+r.viaIds.map(x=>x.key).join('、'):r.basis==='same_session'?'同一会话（未确认同一轮）':'仅时间先后'):'未建立关联'))}const box=E('article','event '+(ev.role||'main'));box.dataset.event=ev.id;const number=E('span','number',String(i+1));const title=E('strong','',ev.title);box.append(number,title,E('p','muted',[ev.time?.raw||'无时间',ev.lane].filter(Boolean).join(' · ')));if(ev.detail)box.append(E('p','',ev.detail));refs(box,ev.evidence);detail(box,'技术详情',ev.tech||[]);if(Object.keys(ev.aiNotes||{}).length)detail(box,'AI 备注，未核对',ev.aiNotes);chain.append(box);prev=ev});

for(const ev of events.filter(e=>e.role==='side'||e.role==='context')){const main=events.filter(e=>!e.role||e.role==='main');const parent=main.filter(e=>e.time?.norm&&ev.time?.norm&&e.time.norm<=ev.time.norm).at(-1)||main[0];const box=E('article','event side');box.append(E('strong','',ev.title),E('p','muted',ev.time?.raw||'无时间'),E('p','',ev.detail||''));refs(box,ev.evidence);const target=[...chain.querySelectorAll('[data-event]')].find(x=>x.dataset.event===parent?.id);(target||chain).append(box)}
let timelineGroup='component';function laneOf(e){return(timelineGroup==='file'?(eds.get(e.evidence?.[0])?.fileId||'未知文件'):(e.lane||'未分组'))+(e.time?.norm?'':' · 无时间/行序 · '+(eds.get(e.evidence?.[0])?.fileId||''))}

const tl=card($('#timeline'),R.coverage.time.available==='none'?'文件内行序':'组件时间线');tl.append(E('p','muted',R.coverage.time.available==='none'?'行序不等于时间间隔。':'实心为主链，空心为旁支。仅显示有证据的关键事件；图中空白不代表日志静默。'));const scroller=E('div','map'),swim=E('div','swim');scroller.append(swim);tl.append(scroller);function drawTimeline(){swim.replaceChildren();const lanes=[...new Set(events.map(e=>laneOf(e)))];for(const lane of lanes){const row=E('div','swimrow');row.append(E('span','',lane));const track=E('div','swimtrack');for(const ev of events.filter(e=>laneOf(e)===lane)){const b=E('button','dot '+(!ev.role||ev.role==='main'?'':'side'),mainNumbers.get(ev.id)||'·');const first=eds.get(ev.evidence?.[0]),f=R.input.files.find(f=>f.id===first?.fileId);b.style.left=(ev.time?.norm&&allTimes.length?pos(ev.time.norm):100*(first?.lines?.[0]||1)/Math.max(1,f?.lineCount||1))+'%';b.title=ev.title;b.setAttribute('aria-label',ev.title);b.onclick=()=>openEvidence(ev.evidence[0]);track.append(b)}lossOverlay(track);row.append(track);swim.append(row)}}
const groupControls=E('div','refs');for(const [mode,label]of [['component','按组件'],['file','按文件']]){const button=E('button','ref',label);button.setAttribute('aria-pressed',String(mode==='component'));button.onclick=()=>{timelineGroup=mode;for(const x of groupControls.children)x.setAttribute('aria-pressed',String(x===button));drawTimeline()};groupControls.append(button)}tl.insertBefore(groupControls,scroller);drawTimeline();

if(R.histogram?.length){const h=E('div','hist'),peak=Math.max(...R.histogram.map(x=>x.count));for(let i=0;i<400;i++){const b=R.histogram.find(x=>x.bucket===i),v=E('span');v.style.height=(b?Math.max(1,b.count/peak*50):0)+'px';v.style.background=b?.errors?'#bd6370':'#8da8e9';v.title=b?`桶 ${i+1}：${b.count} 行，${b.errors} 错误`:`桶 ${i+1}：0 行`;h.append(v)}tl.insertBefore(h,scroller);tl.insertBefore(E('p','muted','全量日志密度（400桶）；红色桶包含ERROR。空桶才表示该聚合区间未记录日志。'),h)}
for(const [namespace,ext]of Object.entries(R.extensions||{})){const passed=(ext.states||[]).filter(x=>x.status==='supported');if(!passed.length)continue;const c=card($('#chain'),namespace.split('@')[0]==='message-roundtrip'?'消息状态':namespace);for(const state of passed){const row=E('article','finding');row.append(E('strong','',state.label),E('p','',state.value));refs(row,state.evidence);c.append(row)}}
const extra=[...chain.querySelectorAll(':scope > .event')].slice(12);if(extra.length){const d=E('details');d.append(E('summary','',`展开其余 ${extra.length} 步`));for(const ev of extra){const prev=ev.previousElementSibling;if(prev?.classList.contains('connector')||prev?.classList.contains('unlinked'))d.append(prev);d.append(ev)}chain.append(d)}
for(const seg of R.segments||[]){const row=mapinner.querySelectorAll('.maprow')[[...R.input.files].findIndex(x=>x.id===seg.fileId)];if(!row)continue;const track=row.querySelector('.track');if(seg.timeRange?.[0]){const b=E('div','bar '+(seg.depth==='deep'?'deep':''));b.style.left=pos(seg.timeRange[0])+'%';b.style.width=Math.max(1,pos(seg.timeRange[1])-pos(seg.timeRange[0]))+'%';b.style.background=seg.depth==='deep'?'#285adc':`hsl(${220-seg.stats.errorDensity*200} 45% 68%)`;b.title=`${seg.id} · ${seg.depth==='deep'?'深入分析':'仅统计'} · 错误/警告密度 ${(seg.stats.errorDensity*100).toFixed(1)}%`;track.append(b)}}
const hy=card($('#hypotheses'),'假设与排除');if(!R.hypotheses.length)hy.append(E('p','empty','本次未建立原因假设。'));for(const h of R.hypotheses){const box=E('article','finding');badge(box,names[h.status]||h.status);box.append(E('h3','',h.statement),E('p','muted','支持证据'));refs(box,h.for);box.append(E('p','muted','反对证据'));refs(box,h.against);detail(box,'查找路径',R.queries.filter(x=>h.queries?.includes(x.id)));hy.append(box)}
const ep=card($('#evidence'),'证据');const filter=E('input');filter.id='filter';filter.placeholder='搜索原文、字段或文件行号　/';filter.setAttribute('aria-label','搜索证据');ep.append(filter);const list=E('div');ep.append(list);function showEvidence(){list.replaceChildren();const term=filter.value.toLocaleLowerCase();for(const e of R.evidence.filter(e=>JSON.stringify([e.ref,e.quote,e.fields]).toLocaleLowerCase().includes(term))){const b=E('button','evidenceitem');b.append(E('strong','',e.ref),E('span','badge',names[e.status]),E('p','muted break',e.status==='supported'?e.quote:'引用未通过校验'));b.onclick=()=>openEvidence(e.id);list.append(b)}}filter.oninput=showEvidence;showEvidence();
const pp=card($('#process'),'处理过程与范围');pp.append(E('p','',`扫描 ${R.coverage.lines.toLocaleString()} 行；检索 ${analysisQueries.length} 次；发布复核 ${replayQueries.length} 次，合计 ${R.queries.reduce((a,q)=>a+(q.seconds||0),0).toFixed(2)} 秒。`),E('p','',names[R.cleanup?.status]||'未记录清理'));detail(pp,'分析目标与类型变更',R.question);detail(pp,'清理结果',R.cleanup);detail(pp,'处理记录',R.decisions);detail(pp,'文件与来源链',R.input);detail(pp,'时间缺口、重叠与覆盖',R.coverage);detail(pp,'完整检索记录',R.queries);detail(pp,'全部邻域评估',R.diagnosis.unlinkedAnomalies||[]);detail(pp,'校验明细',R.validation);if(R.input.project)detail(pp,'未校验代码线索',R.input.project);if(unsupported.length||R.validation.demoted.length){const u=card($('#process'),'未通过校验');u.append(E('p','warning','下列内容未进入结论条。'));detail(u,'降级项目',R.validation.demoted);detail(u,'保留的原始项目',{evidence:R.evidence.filter(x=>x.status!=='supported'),events:unsupported,relations:R.relations.filter(x=>x.status!=='supported'),findings:R.findings.filter(x=>x.status!=='supported'),anomalies:(R.diagnosis.unlinkedAnomalies||[]).filter(x=>x.status!=='supported')})}
for(const [i,row] of [...mapinner.querySelectorAll('.maprow')].entries())lossOverlay(row.querySelector('.track'),R.input.files[i].id);
if(R.build?.sourceHash){const build=E('p','break','源码 SHA256：'+R.build.sourceHash);build.id='source-build';$('footer').append(build);if(R.build.packageHash)$('footer').append(E('p','break','宿主包 SHA256：'+R.build.packageHash+' · '+R.build.host))}
$('footer').append(E('p','','0.2.0-beta.1 · 结果与实际不符时，可显式调用 unified-log-feedback 生成脱敏反馈。'));activate('overview');if(location.hash){const id=decodeURIComponent(location.hash.slice(1));if(eds.has(id))openEvidence(id)}
</script></body></html>
